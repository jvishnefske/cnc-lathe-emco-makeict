[package]
name = "cnc-hil"
description = "The lathe's payloads as built (wasm32), run in mw-posix-node's controller against its simulated lathe: the host-in-the-loop tests."
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[build-dependencies]
# None: build.rs runs cargo for the payloads' wasm32 build.

[dev-dependencies]
mw-posix-node = { path = "../../../middleware-posix-node/posix-node" }
mwctl = { path = "../../../middleware-posix-node/tools/mwctl" }
middleware = { path = "../../../middleware-posix-node", features = ["std"] }
recipe-core.workspace = true
cnc-model = { workspace = true, features = ["alloc"] }
sha2 = "0.10"

