[package]
name = "emco-fleet-agent"
description = "The KD240 fleet agent: polls the fleet server over HTTPS, reports telemetry, and applies owner-signed NixOS updates behind the lathe-service interlock. No machine commands."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "emco-fleet-agent"
path = "src/main.rs"

[dependencies]
emco-fleet-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
ureq.workspace = true
sha2 = "0.10"
# fadvise(DONTNEED), so a slot is read back from the card, not the page cache.
rustix = { version = "1", features = ["fs"] }
# The process payload's run state over Zenoh, for the interlock
# (src/mesh.rs), the release middleware's gateway is built with.
zenoh = "=1.10.1"
tokio = { workspace = true }

[dev-dependencies]
emco-fleet-server.workspace = true
axum.workspace = true
tokio.workspace = true
tempfile.workspace = true
