# DOSBox-X configuration for capturing the EMCO DOS software's serial
# traffic. See README.md in this directory for the full workflow.
#
# COM1 inside DOS is bridged to a TCP connection on the host. Start the
# socat listener (README step 3) BEFORE launching DOSBox-X, then:
#
#   dosbox-x -conf tools/dosbox-capture/dosbox-x.conf
#
# NOTHING here talks to the real machine. Capture with the lathe
# disconnected.

[sdl]
autolock = false

[dosbox]
# The EMCO packages are early-90s software; a 486 profile is plenty and
# keeps timing loops from spinning too fast.
machine = svga_s3
memsize = 16

[cpu]
core = normal
cputype = 486
# Fixed, period-appropriate speed. Software of this era sometimes derives
# serial timing from CPU loops; 'max' can break that.
cycles = fixed 30000

[serial]
# nullmodem in CLIENT mode: connects out to the socat listener on the host.
#   transparent:1  -> raw bytes, no telnet IAC escaping (essential — we are
#                     reverse-engineering a byte protocol)
#   rxdelay/txdelay kept at defaults; note them if timing looks suspicious.
serial1 = nullmodem server:127.0.0.1 port:5555 transparent:1
serial2 = disabled
serial3 = disabled
serial4 = disabled

[autoexec]
# Mount the directory holding the unpacked EMCO software as C: .
# Adjust the path, then start the EMCO program by hand so you can watch it.
mount c ~/emco-dos
c:
echo.
echo COM1 is bridged to tcp://127.0.0.1:5555 (start socat first).
echo Run the EMCO software now, e.g.:  cd EMCO  then  START.BAT
echo.
