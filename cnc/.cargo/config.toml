# The payloads' wasm32 build: mw-posix-node caps a payload's memory at
# 1 MiB by default. They start with 256 KiB of linear memory and a 32 KiB
# stack, more than a microcontroller payload's single page; the process
# model's allocator (std's) may grow it up to the node's 1 MiB.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C", "link-arg=-zstack-size=32768",
  "-C", "link-arg=--initial-memory=262144",
  "-C", "link-arg=--max-memory=1048576",
]
