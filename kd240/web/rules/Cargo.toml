[package]
name = "emco-rules"
description = "The emco_lathe screen's decisions (reference gate, belt and spindle limits, preflight and the proving ladder, touch-off), ported from emco_rules.py. Pure: no I/O, no clock."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = "1"
serde_json = "1"
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# examples/rules_json.rs reads the differential check's floats exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
