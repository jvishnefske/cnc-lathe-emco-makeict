# =============================================================================
# EMCO PC Turn 50 — LinuxCNC SIMULATOR configuration
# =============================================================================
#
# THIS DOES NOT CONTROL THE REAL LATHE, and it cannot be made to.
#
# The machine's control box speaks RS-485 through a proprietary memory-mapped
# ISA card; it is a complete CNC control in its own right, not an amplifier.
# See docs/20-control-architecture.md. This config exists so members can learn
# the machine — its travels, its tooling, its habits — before touching metal.
#
# -----------------------------------------------------------------------------
# WHERE THE NUMBERS COME FROM
# -----------------------------------------------------------------------------
# Everything below is taken from EMCO's own printed manuals, photographed and
# transcribed in docs/_machine-facts.md. They have NOT been re-measured at the
# machine. If you verify one, correct it here and in docs/10-machine-reference.md.
#
#   X travel        48 mm usable (RADIUS — the control programs in diameter)
#   Z travel        228 mm usable (275 mm mechanical)
#   Resolution      0.001 mm
#   Rapid           750 mm/min  = 12.5 mm/s
#   Feed            0-750 mm/min normal, 1500 mm/min absolute mechanical max
#   Spindle         130-3000 rpm in three BELT steps, changed by hand:
#                     130-1300 / 200-2000 / 300-3000
#   Threading       <= 400 rpm
#   Turret          6 stations: 3 external + 3 internal (optional on this model)
#   Collets         ESX 25, 1.5-14 mm
#
# Acceleration is an ESTIMATE. Nothing in the manuals states it; 100 mm/s^2 is a
# plausible figure for 0.95 A five-phase steppers on a machine this size.
#
# -----------------------------------------------------------------------------
# COORDINATE CONVENTION — matches the real machine
# -----------------------------------------------------------------------------
#   X is RADIUS. X0 is the spindle centreline, X48 is fully retracted.
#     The reference sensor sits at X48.
#   Z0 is the reference point at the tailstock end. All travel is NEGATIVE,
#     down to Z-228. Cutting happens at negative Z, toward the chuck.
#
# -----------------------------------------------------------------------------
# HOMING — the habit this simulator exists to teach
# -----------------------------------------------------------------------------
# The real lathe has NO end-of-travel limit switches. Travel simply ends at
# mechanical stops and the stepper stalls, audibly, losing position. It has no
# absolute position memory, so THE REFERENCE POINT MUST BE RE-ESTABLISHED AFTER
# EVERY POWER-OFF. The soft limits configured here are a LinuxCNC safety net
# that the real machine does not have. Do not let them teach false confidence.
# =============================================================================

[EMC]
VERSION = 1.1
MACHINE = EMCO PC Turn 50 (simulator)
DEBUG = 0

[DISPLAY]
DISPLAY = axis
LATHE = 1
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
MIN_SPINDLE_0_OVERRIDE = 0.5
DEFAULT_LINEAR_VELOCITY = 4.0
MAX_LINEAR_VELOCITY = 12.5
MIN_LINEAR_VELOCITY = 0.05
PROGRAM_PREFIX = ../../../gcode
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2

[RS274NGC]
PARAMETER_FILE = emco-pcturn50.var
SUBROUTINE_PATH = ./

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 50000
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALUI = halui
# -no_use_hal_manualtoolchange suppresses the pop-up "change tool by hand"
# dialog. This machine has a powered turret, so turret.hal answers the tool
# change handshake instead.
HALFILE = LIB:basic_sim.tcl -no_use_hal_manualtoolchange
HALFILE = turret.hal

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

[TRAJ]
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
# Rapid traverse is 750 mm/min. LinuxCNC has no separate rapid rate — G0 runs
# at MAX_LINEAR_VELOCITY — so this caps both rapids and feeds. The manual's
# 1500 mm/min is an absolute mechanical maximum, not a working rate.
DEFAULT_LINEAR_VELOCITY = 4.0
MAX_LINEAR_VELOCITY = 12.5
DEFAULT_LINEAR_ACCELERATION = 100.0
MAX_LINEAR_ACCELERATION = 100.0

[EMCIO]
# Use the v2 I/O controller. The v1 "io" shipped with LinuxCNC 2.9.10 accepts
# an E-stop-reset command, reports it complete, and then never raises
# iocontrol.0.user-request-enable — so the machine can never be taken out of
# E-stop. Reproduced with stock upstream configs too, so it is not specific to
# this machine. iov2 behaves correctly.
EMCIO = iov2
TOOL_TABLE = emco-pcturn50.tbl
# Retract clear of the work before the turret rotates. A 6-station turret
# sweeps a wide circle and will hit the part, the chuck or the tailstock if it
# indexes while it is down near the work. X Y Z, machine coordinates; Y is
# ignored on a lathe.
TOOL_CHANGE_POSITION = 48 0 0
TOOL_CHANGE_AT_G30 = 0
TOOL_CHANGE_WITH_SPINDLE_ON = 0

[SPINDLE_0]
# Three belt steps, selected by hand on the real machine. The full envelope:
MAX_FORWARD_VELOCITY = 3000
MIN_FORWARD_VELOCITY = 130

# ------------------------------------------------------------------ X (radius)
[AXIS_X]
MIN_LIMIT = -0.5
MAX_LIMIT = 48.0
MAX_VELOCITY = 12.5
MAX_ACCELERATION = 100.0

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -0.5
MAX_LIMIT = 48.0
MAX_VELOCITY = 12.5
MAX_ACCELERATION = 100.0
# Reference sensor sits at the retracted end, so home searches POSITIVE.
HOME = 48.0
HOME_OFFSET = 48.0
HOME_SEARCH_VEL = 6.0
HOME_LATCH_VEL = -0.5
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0

# ----------------------------------------------------------------------- Z
[AXIS_Z]
MIN_LIMIT = -228.0
MAX_LIMIT = 0.5
MAX_VELOCITY = 12.5
MAX_ACCELERATION = 100.0

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -228.0
MAX_LIMIT = 0.5
MAX_VELOCITY = 12.5
MAX_ACCELERATION = 100.0
# Reference point is at the tailstock end; all travel runs negative from it.
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 6.0
HOME_LATCH_VEL = -0.5
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
