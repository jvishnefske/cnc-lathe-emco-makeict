# =============================================================================
# EMCO PC Turn 50 — Mesa 7i96S RETROFIT configuration (SKELETON)
# =============================================================================
#
# STATUS: PAPER DESIGN. This config has never touched the machine and MUST NOT
# be connected to it until every line tagged UNVERIFIED below has been resolved
# by measurement. Entry conditions and the full design:
#   docs/60-retrofit-design.md   (signal plan, commissioning sequence, risks)
#   docs/adr/0001-serial-vs-retrofit.md  (the standing decision: box stays shut)
#
# The hard rule (doc 60 risk R1): the X104 ribbon pin-by-pin assignment and the
# DIR/CK differential-pair polarity are UNVERIFIED. Meter them before anything
# is connected — a wrong connection can kill the irreplaceable stepper card.
#
# Conventions match the VERIFIED simulator config
# (linuxcnc/sim/emco-pcturn50/emco-pcturn50.ini):
#   X is RADIUS, -0.5 .. 48 mm; the reference sensor sits at X48.
#   Z is 0 .. -228 mm; Z0 is the reference at the tailstock end, all travel
#   negative toward the chuck. Machine zero at the reference position. Metric.
#
# Derived from upstream configs/by_interface/mesa/hm2-stepper/7i96s.ini +
# hm2-stepper-eth.hal (read from a 2.10-dev tree — re-check pin names against
# the 2.9.x you actually run) and from the simulator INI above.
#
# Every number that must be measured at the machine is tagged UNVERIFIED here,
# in the INI — the HAL file reads [SECTION]NAME references and contains no
# machine numbers of its own.
# =============================================================================

[EMC]
VERSION = 1.1
MACHINE = EMCO PC Turn 50 (7i96S retrofit - SKELETON, do not connect)
DEBUG = 0

[DISPLAY]
DISPLAY = axis
LATHE = 1
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
MIN_SPINDLE_0_OVERRIDE = 0.5
DEFAULT_LINEAR_VELOCITY = 4.0
MAX_LINEAR_VELOCITY = 12.5
MIN_LINEAR_VELOCITY = 0.05
PROGRAM_PREFIX = ../../../gcode
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 2

[RS274NGC]
PARAMETER_FILE = emco-pcturn50-7i96s.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
# No BASE_PERIOD: hardware step generation on the 7i96S, servo thread only.
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[HAL]
HALUI = halui
HALFILE = emco-pcturn50-7i96s.hal
# Turret sequencing (ClassicLadder) is a TODO — the HAL file loops the
# tool-change handshake back so manual tool changes work meanwhile.

[KINS]
KINEMATICS = trivkins coordinates=xz
JOINTS = 2

[TRAJ]
COORDINATES = X Z
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
# Rapid 750 mm/min = 12.5 mm/s (manual). G0 runs at MAX_LINEAR_VELOCITY.
DEFAULT_LINEAR_VELOCITY = 4.0
MAX_LINEAR_VELOCITY = 12.5
# UNVERIFIED: acceleration is an estimate (same as the simulator); tune per
# doc 60 sec. 8 step 8 and back off 30 % from stall.
DEFAULT_LINEAR_ACCELERATION = 100.0
MAX_LINEAR_ACCELERATION = 100.0

[EMCIO]
# iov2: the v1 "io" in 2.9.10 never re-enables after E-stop reset (see the
# simulator INI for the write-up).
EMCIO = iov2
TOOL_TABLE = tool.tbl
# Retract clear of the work before the 6-station turret sweeps its circle.
TOOL_CHANGE_POSITION = 48 0 0
TOOL_CHANGE_AT_G30 = 0
TOOL_CHANGE_WITH_SPINDLE_ON = 0

[HOSTMOT2]
DRIVER = hm2_eth
BOARD = 7i96s
# UNVERIFIED: set to the address configured on the card; needs a dedicated NIC.
BOARD_IP = 192.168.1.121
# pwmgen 0 feeds the board's isolated 0-10 V spindle output.
CONFIG = "num_encoders=1 num_pwmgens=1 num_stepgens=3"

[SPINDLE_0]
# 130-3000 rpm across three belt steps changed BY HAND (130-1300 / 200-2000 /
# 300-3000). The 0-10 V scaling below assumes ONE belt step; the operator must
# keep the selected step and OUTPUT_SCALE consistent — see doc 60 sec. 4.4.
# UNVERIFIED: FRC105 inverter acceptance of an external 0-10 V reference.
MAX_FORWARD_VELOCITY = 3000
MIN_FORWARD_VELOCITY = 130
# rpm at 10 V for the fitted belt step (placeholder: middle step, 2000 rpm)
OUTPUT_SCALE = 2000
# UNVERIFIED: spindle encoder resolution — X109 STROBE/SYNC channel count and
# counts/rev are unknown (doc 60 sec. 4.5). Placeholder 1 count/rev + index.
ENCODER_SCALE = 1

# ------------------------------------------------------------------ X (radius)
[AXIS_X]
MIN_LIMIT = -0.5
MAX_LIMIT = 48.0
MAX_VELOCITY = 12.5
MAX_ACCELERATION = 100.0

[JOINT_0]
TYPE = LINEAR
MIN_LIMIT = -0.5
MAX_LIMIT = 48.0
MAX_VELOCITY = 12.5
MAX_ACCELERATION = 100.0
# Stepgen headroom above the joint limits, per upstream practice.
STEPGEN_MAX_VEL = 15.0
STEPGEN_MAX_ACC = 125.0
# UNVERIFIED SCALE: manual says 0.001 mm/step (=> 1000 steps/mm) with the
# power card in half-step (DIP S301); ballscrew pitch and any reduction are
# unknown. Verify with a dial indicator (doc 60 sec. 8 step 7). Sign flips
# here if the axis moves the wrong way — positive X away from centreline.
SCALE = 1000
# UNVERIFIED step timing: conservative for early-90s inputs; tune later.
# (nanoseconds)
STEPLEN = 5000
STEPSPACE = 5000
DIRSETUP = 10000
DIRHOLD = 10000
FERROR = 0.5
MIN_FERROR = 0.05
# Reference switch at the retracted (+) end, as on the real machine and sim.
HOME = 48.0
HOME_OFFSET = 48.0
# UNVERIFIED: switch position/repeatability; start slow.
HOME_SEARCH_VEL = 6.0
HOME_LATCH_VEL = -0.5
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0

# ----------------------------------------------------------------------- Z
[AXIS_Z]
MIN_LIMIT = -228.0
MAX_LIMIT = 0.5
MAX_VELOCITY = 12.5
MAX_ACCELERATION = 100.0

[JOINT_1]
TYPE = LINEAR
MIN_LIMIT = -228.0
MAX_LIMIT = 0.5
MAX_VELOCITY = 12.5
MAX_ACCELERATION = 100.0
STEPGEN_MAX_VEL = 15.0
STEPGEN_MAX_ACC = 125.0
# UNVERIFIED SCALE — same caveats as X. Positive Z away from the chuck.
SCALE = 1000
# UNVERIFIED step timing (nanoseconds)
STEPLEN = 5000
STEPSPACE = 5000
DIRSETUP = 10000
DIRHOLD = 10000
FERROR = 0.5
MIN_FERROR = 0.05
# Reference at the tailstock end; all travel negative from it.
HOME = 0.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 6.0
HOME_LATCH_VEL = -0.5
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 1
