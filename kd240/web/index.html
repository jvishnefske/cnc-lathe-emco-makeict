<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMCO PC Turn 50 — egui screen</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1b1b1b; color: #ddd; font: 14px system-ui, sans-serif; }
    #emco_canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; }
  </style>
</head>
<body>
  <!-- The emco_lathe screen (kd240/web/app), egui on WebGL. Nothing here moves
       the real lathe; Abort is advisory. The RxJS UI is at / . -->
  <canvas id="emco_canvas"></canvas>
  <div id="status">Loading the screen… (it needs WebAssembly and WebGL; the plain UI is at <a href="/" style="color:#8cf">/</a>)</div>
  <script type="module">
    import init from "./emco_egui.js";
    init({ module_or_path: new URL("./emco_egui_bg.wasm", import.meta.url) }).catch((e) => {
      document.getElementById("status").textContent = "The screen did not start: " + e;
    });
  </script>
</body>
</html>
