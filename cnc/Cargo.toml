# The lathe on middleware (README.md here): S88 physical and procedural
# models as WASM payloads for mw-posix-node, and the model they share.
#
#   model/     cnc-model     the physical configuration (one machine's
#                            travel, speeds, belts, turret, switches, I/O),
#                            the control-module traits, and the wire between
#                            the process and physical payloads. no_std+alloc.
#   physical/  cnc-physical  the physical model: a WASM payload serving the
#                            unit's equipment phases over the node's
#                            control-module points (ABI 8).
#
# Built for the host (tests) and for wasm32-unknown-unknown (the payloads,
# `cargo build --release --target wasm32-unknown-unknown -p cnc-physical`).
[workspace]
resolver = "2"
members = ["model", "physical", "process", "hil"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
cnc-model = { path = "model", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
# middleware (github.com/jvishnefske/middleware, pinned to a commit of
# stack/posix-node): the ABI's machine messages, recipe-core's S88 phases,
# the payload SDK, mw-posix-node and mwctl for the host-in-the-loop tests.
# Against a local checkout: cargo --config 'patch."https://github.com/jvishnefske/middleware".middleware.path="../../middleware"' …
middleware = { git = "https://github.com/jvishnefske/middleware", rev = "514f9747c114f70058361db13365f5efd806775e", default-features = false }
recipe-core = { git = "https://github.com/jvishnefske/middleware", rev = "514f9747c114f70058361db13365f5efd806775e" }
mw-payload = { git = "https://github.com/jvishnefske/middleware", rev = "514f9747c114f70058361db13365f5efd806775e", default-features = false }
mw-posix-node = { git = "https://github.com/jvishnefske/middleware", rev = "514f9747c114f70058361db13365f5efd806775e" }
mwctl = { git = "https://github.com/jvishnefske/middleware", rev = "514f9747c114f70058361db13365f5efd806775e" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

[profile.dev]
panic = "abort"
